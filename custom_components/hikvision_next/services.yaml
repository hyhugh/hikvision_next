update_snapshot:
  name: Update snapshot
  description: Update the snapshot file in an image entity. Used by take_pictures_on_motion_detection blueprint.
  target:
    entity:
      domain: image
      integration: hikvision_next
  fields:
    filename:
      required: true
      name: Filename
      description: The filename of the snapshot to display.
      example: "/media/hikvision_next/snapshots/2024-08/07/2024-08-07__11-54-19__camera01.jpg"
      selector:
        text:

reboot:
  name: Reboot
  description: Reboot the device.
  fields:
    config_entry_id:
      required: true
      name: "Device"
      description: "Permission needed  - Remote: Shutdown/Reboot"
      selector:
        config_entry:
          integration: hikvision_next

isapi_request:
  name: ISAPI request
  description: "Send a custom ISAPI request to the device."
  fields:
    config_entry_id:
      required: true
      name: "Device"
      description: "The Hikvision device."
      selector:
        config_entry:
          integration: hikvision_next
    method:
      required: true
      name: "HTTP method"
      description: "WARNING: You do POST and PUT at your own risk!"
      default: GET
      selector:
        select:
          mode: dropdown
          options:
            - GET
            - POST
            - PUT
    path:
      required: true
      name: "ISAPI path"
      description: "The ISAPI endpoint to request. Example: /System/deviceInfo"
      selector:
        text:
    payload:
      required: false
      name: "Request payload"
      description: "XML data"
      selector:
        text:
          multiline: true

extract_nvr_clip:
  name: Extract NVR clip
  description: Download a video clip from the NVR's storage.
  target:
    entity:
      domain: camera
      integration: hikvision_next
  fields:
    duration:
      required: true
      name: Duration
      description: Total duration of the clip in seconds.
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    lookback:
      required: false
      name: Lookback
      description: Seconds before the trigger to include in the clip.
      default: 10
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    filename:
      required: true
      name: Filename
      description: The filename to save the clip to.
      example: "/media/hikvision_next/recordings/front_door.mp4"
      selector:
        text:

extract_nvr_clip_by_time:
  name: Extract NVR clip by exact time
  description: Download a video clip from the NVR's storage using an exact start and end time.
  fields:
    entity_id:
      required: true
      name: Camera
      description: The camera to extract the clip from. Must be the main stream.
      selector:
        entity:
          domain: camera
          integration: hikvision_next
    start_time:
      required: true
      name: Start Time
      description: Exact start time of the event (ISO format).
      selector:
        text:
    end_time:
      required: true
      name: End Time
      description: Exact end time of the event (ISO format).
      selector:
        text:
    pre_buffer:
      required: false
      name: Pre-buffer
      description: Seconds to include before the start time.
      default: 10
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    post_buffer:
      required: false
      name: Post-buffer
      description: Seconds to include after the end time.
      default: 20
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    filename:
      required: true
      name: Filename
      description: The filename to save the clip to.
      example: "/media/hikvision_next/recordings/front_door.mp4"
      selector:
        text:
